<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Works 3D — Orçamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFFDF8;
    --ink: #3A3247;
    --ink-soft: #756C87;
    --coral: #FF9E85;
    --violet: #B9A6D9;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background: var(--bg);
    font-family:'Nunito', sans-serif;
    color: var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height: 100vh;
    padding: 24px;
    text-align:center;
  }
  .wrap{ max-width: 420px; }
  .ribbon{
    height: 8px;
    width: 80px;
    border-radius: 100px;
    background: linear-gradient(90deg, var(--coral), var(--violet));
    margin: 0 auto 24px;
  }
  h1{
    font-family:'Poppins', sans-serif;
    font-weight: 800;
    font-size: 22px;
    margin-bottom: 10px;
  }
  p{ color: var(--ink-soft); font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ribbon"></div>
  <h1>Creative Works 3D</h1>
  <p>Orçamentos personalizados enviados diretamente aos clientes.<br>Se você recebeu um link de orçamento, acesse-o diretamente.</p>
</div>
</body>
</html>
